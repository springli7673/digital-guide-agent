server:
  port: 8080

spring:
  application:
    name: digital-guide-backend
  datasource:
    # stringtype=unspecified 让 jsonb 列可以直接写入字符串
    url: jdbc:postgresql://127.0.0.1:5432/digital_guide?stringtype=unspecified
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 本机 Redis 是带密码的（不带密码会 ERR Client sent AUTH）。
      # 默认填本机密码，是为了"拉下来就能跑"；换机器用 REDIS_PASSWORD 覆盖。
      # 注意：登录/注册**不是** fail-open —— Redis 连不上就登不进去，
      # 启动时 StartupCheck 会打一条显眼的 error 日志。
      password: ${REDIS_PASSWORD:123456}
      timeout: 3s
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# ---------------------------------------------------------------------------
# 推荐 Agent（进程内，不再有独立的 Python 服务）
#
# provider 决定走哪一端：deepseek 用云端，ollama 用本机。
# 两个端点都是 OpenAI 兼容协议，切换只改这一行 / 一个环境变量。
# ---------------------------------------------------------------------------
ai:
  llm:
    provider: ${AI_PROVIDER:deepseek}
    deepseek:
      base-url: https://api.deepseek.com
      # 不要把 key 写进仓库：用环境变量 DEEPSEEK_API_KEY
      api-key: ${DEEPSEEK_API_KEY:}
      chat-model: deepseek-chat
      json-mode: true
    ollama:
      base-url: http://127.0.0.1:11434
      api-key: ""
      chat-model: qwen3:8b
      json-mode: true
    router-temperature: 0.0
    router-max-tokens: 700
    answer-temperature: 0.3
    answer-max-tokens: 900
    connect-timeout-seconds: 10
    read-timeout-seconds: 90

  # 向量化单独一组：DeepSeek 没有 embedding 接口，只能走本地 Ollama 的 bge-m3
  embedding:
    base-url: http://127.0.0.1:11434
    api-key: ""
    model: bge-m3
    dimensions: 1024          # 改维度要同步改 db/migration_rag.sql 里的 vector(1024)

  # RAG：三段预算 + RRF + 精排 + 证据闸门
  rag:
    recall-budget: 20          # ① 每路召回条数
    rerank-candidate-limit: 40 # ② 融合后送精排的池子上限
    top-k: 5                   # ③ 最终进提示词的条数
    rrf-k: 20                  # 候选池只有几十条，k=60 会过度平滑名次
    rerank-enabled: true
    min-rerank-score: 0.2      # 证据闸门：最高精排分低于它就整批丢弃
    chunk-size: 420
    chunk-overlap: 80

  # 会话记忆：PG 是权威，Redis 是热存
  memory:
    window-size: 8             # 滑动窗口保留最近几条消息
    summarize-after: 16        # 超过多少条触发摘要压缩
    summary-max-chars: 400
    enabled: true
    redis-enabled: true
    redis-ttl-minutes: 30      # 连续追问时命中，整轮不碰 PG

  # Redis 侧的防打穿设施。三个都遵循"Redis 挂了就放行"，不阻断对话
  cache:
    enabled: true
    candidates-ttl-minutes: 10 # 候选集缓存：同品类+预算+品牌 10 分钟内复用
    rate-limit-per-minute: 20  # 单会话每分钟请求上限
    session-lock-seconds: 30   # 会话锁过期时间（进程被 kill 也不会永久占锁）
    session-lock-wait-ms: 800  # 连点两次发送时，第二次最多等这么久

logging:
  level:
    com.digitalguide: info

# 一键起依赖：PostgreSQL(pgvector) + Redis + Ollama
#
#   docker compose up -d          起全部
#   docker compose ps             看状态
#   docker compose down           停（数据保留在卷里）
#   docker compose down -v        停并删数据
#
# 注意：应用本身不进 compose。开发时在 IDEA 里跑，发布时用 Dockerfile 单独打包。
# Ollama 放进来的目的是让"干净机器"能一条命令跑起来；如果你本机已经装了
# Ollama（Windows 上能用 GPU），就别起这个服务，直连本机的 11434 就行。

services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: digital-guide-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: digital_guide
      # 中文排序/比较用 C 排序规则，避免镜像 locale 差异导致 order by 结果不一致
      LANG: C.UTF-8
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 容器**首次**初始化时按文件名顺序执行；表结构都在这里，不用再手工跑 psql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/migration_rag.sql:/docker-entrypoint-initdb.d/02-rag.sql:ro
      - ./db/migration_trace.sql:/docker-entrypoint-initdb.d/03-trace.sql:ro
      - ./db/migration_memory.sql:/docker-entrypoint-initdb.d/04-memory.sql:ro
      # 商品种子数据（可选）：完整目录由 tools/ 生成，仓库里可能只放了样例
      - ./db/seed_products.sql:/docker-entrypoint-initdb.d/05-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digital_guide"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: digital-guide-redis
    ports:
      - "6379:6379"
    # 本机 Redis 无密码，配置里也别写 password，否则报 ERR Client sent AUTH
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    container_name: digital-guide-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # 首次启动后要手动拉模型（见 README）：docker compose exec ollama ollama pull bge-m3

volumes:
  pgdata:
  ollama:
